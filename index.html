<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Konversi Celsius ke Kelvin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 40px;
    }
    h2 {
      text-align: center;
    }
    .container {
      max-width: 350px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #999;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      background: #e9ecef;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h2>Konversi Celsius ke Kelvin</h2>
  <div class="container">
    <label for="celsius">Masukkan Suhu dalam Celsius (°C)</label>
    <input type="number" id="celsius" placeholder="Contoh: 25">

    <button onclick="konversi()">Konversi</button>

    <div class="result" id="hasil"></div>
  </div>

  <script>
    function konversi() {
      let celsius = parseFloat(document.getElementById("celsius").value);

      if (isNaN(celsius)) {
        document.getElementById("hasil").innerHTML = "⚠️ Masukkan angka terlebih dahulu!";
        return;
      }

      // Rumus konversi Celsius ke Kelvin
      let kelvin = celsius + 273.15;

      // Tampilkan hasil
      document.getElementById("hasil").innerHTML = `
        🌡️ ${celsius} °C = <b>${kelvin.toFixed(2)} K</b>
      `;
    }
  </script>
</body>
</html>
